<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamacode | Soluciones Tecnológicas & Desarrollo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 650px;
      width: 100%;
      text-align: center;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin: 1.5rem 0;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .service-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
      text-align: left;
    }

    .service-item h3 {
      font-size: 1rem;
      color: var(--text-main);
    }

    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #0f172a;
      font-weight: 700;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1 class="logo">GAMACODE</h1>
      <p class="tagline">Desarrollo Web & Soluciones Tecnológicas</p>

      <div class="divider"></div>

      <div class="services">
        <div class="service-item">
          <h3>Sistemas & Aplicaciones Web</h3>
        </div>
        <div class="service-item">
          <h3>Automatizaciones & Integraciones</h3>
        </div>
        <div class="service-item">
          <h3>Consultoría & Soporte Técnico</h3>
        </div>
      </div>

      <a href="mailto:contacto@gamacode.cl" class="btn">Contáctanos</a>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Gamacode.cl — Todos los derechos reservados.</p>
  </footer>

</body>
</html>
